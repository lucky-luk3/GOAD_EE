# DCSync : grant one or more principals the replication extended rights
# (DS-Replication-Get-Changes + DS-Replication-Get-Changes-All) on the domain
# object. This is the durable, AdminSDHolder-proof way to give a chain a terminal
# "-> Domain Admins" edge: BloodHound / GrexID render it as a DCSync edge (full
# domain compromise). Unlike ACEs on protected groups (Domain Admins) or their
# members, ACEs on the domain root are NOT reverted by SDProp.
#
# RUN me on DC, as the domain admin (become runas).
#
# vulns_vars example (per host, in config.json):
#   "dcsync": {
#     "sergio":       { "principal": "sergio.h" },
#     "serveradmins": { "principal": "Server Administrators" },
#     "gpomanagers":  { "principal": "GPO Managers" }
#   }
- name: "DCSync : grant replication rights to '{{ item.value.principal }}' on the domain"
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $Principal
      )
      Import-Module ActiveDirectory
      $domainDN = (Get-ADDomain).DistinguishedName

      $obj = Get-ADObject -Filter "SamAccountName -eq '$Principal'" -Properties objectSid
      if (-not $obj) { throw "Principal '$Principal' not found" }
      $sid = New-Object System.Security.Principal.SecurityIdentifier ($obj.objectSid)

      # DS-Replication-Get-Changes and DS-Replication-Get-Changes-All
      $rights = @(
          "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2",
          "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2"
      )
      $path = "AD:\$domainDN"
      $acl = Get-Acl -Path $path
      foreach ($g in $rights) {
          $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
              $sid,
              [System.DirectoryServices.ActiveDirectoryRights]"ExtendedRight",
              [System.Security.AccessControl.AccessControlType]"Allow",
              [Guid]$g
          )
          $acl.AddAccessRule($ace)
      }
      Set-Acl -Path $path -AclObject $acl
      $Ansible.Changed = $true
    error_action: stop
    parameters:
      Principal: "{{ item.value.principal }}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    domain_name: "{{ domain }}"
    ansible_become_user: "{{ domain_username }}"
    ansible_become_password: "{{ domain_password }}"
  with_dict: "{{ vulns_vars }}"
